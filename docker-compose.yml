services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxo-postgres
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fluxo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fluxo-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos.Api/Dockerfile
    container_name: fluxo-lancamentos
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Lancamentos: Host=postgres;Port=5432;Database=lancamentos;Username=fluxo;Password=fluxo
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Database__UseInMemory: "false"
      Messaging__UseInMemory: "false"
    ports:
      - "5081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consolidacao-api:
    build:
      context: .
      dockerfile: src/Consolidacao.Api/Dockerfile
    container_name: fluxo-consolidacao
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Consolidacao: Host=postgres;Port=5432;Database=consolidacao;Username=fluxo;Password=fluxo
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Database__UseInMemory: "false"
      Messaging__UseInMemory: "false"
      Cache__UseMemory: "false"
    ports:
      - "5082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
